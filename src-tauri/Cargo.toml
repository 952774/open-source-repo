[package]
name = "toolark"
version = "1.2.1"
description = "ToolArk 工具方舟 - GitHub 优质工具聚合桌面应用"
authors = ["ToolArk"]
edition = "2021"

[lib]
name = "toolark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 单实例：避免多开导致 installed.json 并发覆盖
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
encoding_rs = "0.8"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 体积与启动速度：LTO + 单 codegen 单元 + 去符号
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
